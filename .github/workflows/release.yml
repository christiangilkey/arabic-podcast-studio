# Builds Windows, macOS and Linux installers and publishes them to GitHub Releases.
#
# Trigger: push a tag like v0.1.0  (git tag v0.1.0 && git push origin v0.1.0)
# Manual runs (Actions tab → Release → Run workflow) build and test but don't publish.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries (for PyGObject)
        run: sudo apt-get update && sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/js/*.test.mjs

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-14          # Apple Silicon
            target: macos
          - os: ubuntu-22.04      # oldest supported glibc, so the AppImage runs on newer distros
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp version and repository
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          # Throwaway data folder for the smoke tests (runner context isn't allowed in job-level env).
          echo "APS_DATA_DIR=$RUNNER_TEMP/aps-smoke" >> "$GITHUB_ENV"
          python - "$V" "$GITHUB_REPOSITORY" <<'EOF'
          import pathlib, re, sys
          p = pathlib.Path("app/version.py")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r'__version__ = ".*?"', f'__version__ = "{sys.argv[1]}"', s)
          s = re.sub(r'GITHUB_REPO = ".*?"', f'GITHUB_REPO = "{sys.argv[2]}"', s)
          p.write_text(s, encoding="utf-8")
          EOF
          grep -E "__version__|GITHUB_REPO" app/version.py

      - name: Google sign-in client (for Drive sync)
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            python - <<'EOF'
          import json, os, re, sys
          cid = os.environ["GOOGLE_CLIENT_ID"].strip().strip('"')
          secret = os.environ["GOOGLE_CLIENT_SECRET"].strip().strip('"')
          def hint(v):  # describes a value without revealing it
              quote = chr(34)
              return (f"length {len(v)}, starts with a digit: {v[:1].isdigit()}, has quotes: {quote in v}, "
                      f"has ':' or ',': {':' in v or ',' in v}, has spaces: {' ' in v}")
          problems = []
          if not re.fullmatch(r"[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com", cid):
              problems.append("GOOGLE_CLIENT_ID should look like 1234-abcd.apps.googleusercontent.com (" + hint(cid) + ")")
          if not re.fullmatch(r"GOCSPX-[A-Za-z0-9_-]{20,}", secret):
              problems.append("GOOGLE_CLIENT_SECRET should look like GOCSPX-... (" + hint(secret) + ")")
          if problems:
              sys.exit(" | ".join(problems))
          json.dump({"client_id": cid, "client_secret": secret}, open("app/sync/google_client.json", "w"))
          print("Bundled Google client", cid[:12] + "...")
          EOF
          else
            echo "::warning::GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET secrets not set; this build will have sync disabled."
          fi

      - name: Linux system libraries
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config \
            gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0 libfuse2

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: pyinstaller packaging/app.spec --noconfirm --distpath dist --workpath build

      # ---- Smoke tests: run the packaged app with Python removed from PATH ----
      - name: Smoke test (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $p = Start-Process -FilePath "dist\ArabicPodcastStudio\ArabicPodcastStudio.exe" -ArgumentList "--smoke-test" -Wait -PassThru -NoNewWindow
          Get-Content "$env:APS_DATA_DIR\smoke-report.json"
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }

      - name: Smoke test (macOS, MLX on Metal)
        if: matrix.target == 'macos'
        continue-on-error: true   # CI VMs may not expose Metal; real Macs do
        run: env PATH=/usr/bin:/bin "dist/Arabic Podcast Studio.app/Contents/MacOS/ArabicPodcastStudio" --smoke-test

      - name: Smoke test (macOS, faster-whisper CPU)
        if: matrix.target == 'macos'
        run: |
          rm -rf "$APS_DATA_DIR"
          env PATH=/usr/bin:/bin APS_ENGINE=faster-whisper "dist/Arabic Podcast Studio.app/Contents/MacOS/ArabicPodcastStudio" --smoke-test

      - name: Smoke test (Linux)
        if: matrix.target == 'linux'
        run: env -i HOME="$HOME" PATH=/usr/bin:/bin APS_DATA_DIR="$APS_DATA_DIR" dist/ArabicPodcastStudio/ArabicPodcastStudio --smoke-test

      # ---- Installers ----
      - name: Windows installer (Inno Setup)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: macOS disk image
        if: matrix.target == 'macos'
        run: bash packaging/macos/make_dmg.sh "$VERSION"

      - name: Linux AppImage
        if: matrix.target == 'linux'
        run: |
          bash packaging/linux/make_appimage.sh "$VERSION"
          rm -rf "$APS_DATA_DIR"
          env -i HOME="$HOME" PATH=/usr/bin:/bin APS_DATA_DIR="$APS_DATA_DIR" \
            dist/ArabicPodcastStudio-*.AppImage --appimage-extract-and-run --smoke-test

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: |
            dist/*-Setup.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
