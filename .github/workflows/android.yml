# Builds the signed Android app (.apk).
# - Runs on pushes that change the phone app or the shared screens (test builds, downloadable
#   from the run's "Artifacts"), and by hand from the Actions tab.
# - The Release workflow calls it for tagged releases and attaches the APK to the release.

name: Android

on:
  push:
    branches: [main]
    paths: ["mobile/**", "web/**", ".github/workflows/android.yml"]
  workflow_dispatch:
  workflow_call:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          IFS=. read -r MA MI PA <<< "${V%%-*}"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_ENV"

      - name: Signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets are missing"; exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$(echo "$KEYSTORE_PASSWORD" | tr -d ' \r\n')" >> "$GITHUB_ENV"
          # Fail early, with a clear message, if the password doesn't open the key.
          keytool -list -keystore "$RUNNER_TEMP/release.p12" -storetype pkcs12 \
            -storepass "$(echo "$KEYSTORE_PASSWORD" | tr -d ' \r\n')" > /dev/null \
            || { echo "::error::The keystore and password secrets don't match"; exit 1; }

      - name: Build web bundle and sync into the Android project
        working-directory: mobile
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build signed APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # Surface the real errors as annotations (readable without opening the full log).
            grep -E "error:|ERROR|FAILURE|What went wrong|Could not|> " "$RUNNER_TEMP/gradle.log"               | grep -v "^> Task" | head -25 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi

      - name: Verify signature
        shell: bash
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          grep -qi "SHA-1 digest: ac3a1ec9d5b95a23a23384bf1eb68b97fb368541" "$RUNNER_TEMP/certs.txt" \
            || { echo "::error::APK isn't signed with the expected release key"; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/ArabicPodcastStudio-${APP_VERSION}-Android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-android
          path: dist/*.apk
          if-no-files-found: error
